[workspace]
members = [".", "chalk-metrics-macros"]

[package]
name = "chalk-metrics"
version = "0.0.4"
edition = "2024"
license = "Apache-2.0"
description = "Fast composable metrics defined with Rust macros"
repository = "https://github.com/chalk-ai/chalk-metrics"
documentation = "https://docs.rs/chalk-metrics"
rust-version = "1.88"
include = ["src/**", "README.md", "LICENSE", "CHANGELOG.md"]

[features]
python-bindings = ["dep:pyo3"]

[dependencies]
chalk-metrics-macros = { path = "chalk-metrics-macros", version = "=0.0.4" }
parking_lot = "0.12"
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"] }
libc = "0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
async-trait = "0.1"
pyo3 = { version = "0.30", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "rayon"] }
trybuild = "1.0"

[[bench]]
name = "metrics_throughput"
harness = false

[[bench]]
name = "prometheus_export"
harness = false

[[bench]]
name = "statsd_export"
harness = false

[[bench]]
name = "distribution_volume"
harness = false

[[bench]]
name = "name_recording"
harness = false

[[bench]]
name = "generated_recording"
harness = false

[[bench]]
name = "thread_scaling"
harness = false

[[bench]]
name = "flush"
harness = false

[[bench]]
name = "delivery"
harness = false

[[bench]]
name = "compile_time"
harness = false
