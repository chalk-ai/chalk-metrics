name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy

      # Verify the tag matches both crate versions
      - name: Verify version match
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Tag version: $TAG_VERSION"
          for manifest in Cargo.toml chalk-metrics-macros/Cargo.toml; do
            CARGO_VERSION=$(grep '^version = ' "$manifest" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "$manifest version: $CARGO_VERSION"
            if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
              echo "Error: Tag version ($TAG_VERSION) does not match $manifest version ($CARGO_VERSION)"
              exit 1
            fi
          done

      # Run tests and checks before publishing
      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps

      # Publishes chalk-metrics-macros before chalk-metrics
      - name: Publish to crates.io
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
