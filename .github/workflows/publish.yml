name: Publish to crates.io

# Triggered by `make release`, which creates the GitHub release and its tag.
on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy

      # The tag is the source of truth: write its version into both crates and
      # the pinned macros dependency, then refresh Cargo.lock.
      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Error: tag $GITHUB_REF_NAME is not v<semver>"
            exit 1
          fi
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml chalk-metrics-macros/Cargo.toml
          sed -i "s/^\(chalk-metrics-macros = {.*version = \"=\)[^\"]*\"/\1$VERSION\"/" Cargo.toml
          cargo update --workspace
          git diff
          cargo metadata --no-deps --format-version 1 | jq -e --arg v "$VERSION" '
            [.packages[].version] + [.packages[].dependencies[]
              | select(.name == "chalk-metrics-macros") | .req | ltrimstr("=")]
            | length == 3 and all(. == $v)' > /dev/null

      # Run tests and checks before publishing
      - name: Run tests
        run: |
          cargo test --locked --workspace
          cargo test --locked --workspace --all-features

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps

      # Publishes chalk-metrics-macros before chalk-metrics
      - name: Publish to crates.io
        run: cargo publish --workspace --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
