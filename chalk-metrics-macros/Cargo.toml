[package]
name = "chalk-metrics-macros"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Proc macros for chalk-metrics"
repository = "https://github.com/chalk-ai/chalk-metrics"
rust-version = "1.88"
include = ["src/**"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3", features = ["full"] }
